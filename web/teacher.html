<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多语教师 · AI 课堂</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<style>
  :root {
    --bg: #f7f7f8; --card: #ffffff; --line: #e4e4e7;
    --text: #1a1a1e; --sub: #71717a; --brand: #4f46e5; --brand-soft: #eef2ff;
    --ok: #16a34a; --warn: #d97706; --err: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
  #app { display: flex; height: 100vh; }
  /* ---------- 左栏 ---------- */
  #sidebar { width: 300px; min-width: 260px; background: var(--card); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  #sb-head { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  #sb-head h1 { font-size: 17px; }
  #sb-head p { font-size: 12px; color: var(--sub); margin-top: 2px; }
  #sb-ws { font-size: 11px; color: var(--ok); background: #f0fdf4; padding: 5px 16px; border-bottom: 1px solid var(--line); }
  #lang-tabs { display: flex; gap: 6px; padding: 10px 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .lang-tab { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 13px; cursor: pointer; color: var(--sub); }
  .lang-tab.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  #session-list { flex: 1; overflow-y: auto; padding: 8px; }
  .sess-item { padding: 10px 12px; border-radius: 10px; cursor: pointer; margin-bottom: 2px; font-size: 13px; }
  .sess-item:hover { background: var(--bg); }
  .sess-item.active { background: var(--brand-soft); }
  .sess-item .s-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--text); line-height: 1.4; }
  .sess-item .s-meta { font-size: 11px; color: var(--sub); margin-top: 4px; display: flex; justify-content: space-between; }
  .sess-item .s-line { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #eee; color: var(--sub); margin-bottom: 4px; }
  .sess-item .s-line.jp { background: #e8f4fd; color: #0369a1; }
  .sess-item .s-line.fr { background: #fdeeee; color: #b91c1c; }
  .sess-item .s-line.mnc { background: #f3eefc; color: #6d28d9; }
  .sess-item .s-line.tr { background: #fef9e7; color: #a16207; }
  .badge { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ok); margin-right:5px; vertical-align:middle;}
  .badge.busy { background: var(--warn); }
  #sb-new { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  #new-sess-btn { flex: 1; padding: 9px; border: none; border-radius: 10px; background: var(--brand); color: #fff; font-size: 14px; cursor: pointer; }
  #new-sess-btn:hover { opacity: .9; }
  #conn { font-size: 11px; color: var(--sub); padding: 8px 14px; border-top: 1px solid var(--line); display:flex; align-items:center; gap:6px; }
  /* ---------- 主区 ---------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat-head { padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--card); display: flex; justify-content: space-between; align-items: center; }
  #chat-title { font-size: 15px; font-weight: 600; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #chat-actions { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--sub); }
  #messages { flex: 1; overflow-y: auto; padding: 20px; background: var(--bg); }
  .msg { max-width: 78%; margin-bottom: 14px; display: flex; flex-direction: column; }
  .msg.user { align-self: flex-end; align-items: flex-end; margin-left: auto; }
  .msg.assistant { align-self: flex-start; margin-right: auto; }
  .bubble { padding: 10px 14px; border-radius: 14px; line-height: 1.6; font-size: 14px; word-break: break-word; }
  .msg.user .bubble { background: var(--brand); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg .bubble code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .msg .bubble pre { background: #0d1117; color: #e6edf3; padding: 10px; border-radius: 8px; overflow-x: auto; margin: 6px 0; font-size: 12.5px; white-space: pre-wrap; }
  .msg .bubble pre code { background: none; color: inherit; padding: 0; }
  .tool-event { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; color: var(--sub); margin: 4px 0 10px; align-self: flex-start; max-width: 85%; }
  .tool-event.t-done { opacity: .75; }
  .tool-event .t-name { font-weight: 600; color: var(--text); }
  .tool-event .t-io { margin-top: 4px; font-size: 11.5px; color: var(--sub); max-height: 120px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  .stream-cursor { display: inline-block; width: 8px; height: 15px; background: var(--brand); animation: blink 1s infinite; vertical-align: -2px; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }
  #input-row { display: flex; gap: 10px; padding: 14px 18px; background: var(--card); border-top: 1px solid var(--line); align-items: flex-end; }
  #prompt { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; font-family: inherit; line-height: 1.5; outline: none; max-height: 160px; }
  #prompt:focus { border-color: var(--brand); }
  #send { padding: 12px 22px; border: none; border-radius: 12px; background: var(--brand); color: #fff; font-size: 14px; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  .typing { color: var(--sub); font-size: 13px; padding: 6px 2px; }
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--sub); }
  .empty h2 { font-size: 22px; margin-bottom: 8px; color: var(--text); }
  .empty p { font-size: 14px; line-height: 1.8; text-align: center; }
  .empty .lang-picks { display: flex; gap: 10px; margin-top: 18px; }
  .empty .lang-picks button { padding: 10px 22px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 15px; cursor: pointer; }
  .empty .lang-picks button:hover { border-color: var(--brand); color: var(--brand); }
  .notice { font-size: 12px; color: var(--sub); text-align: center; padding: 6px 20px; background: var(--bg); }
  mark { background: #fde68a; padding: 0 2px; border-radius: 3px; }
  /* ---------- Markdown(教学内容, marked + DOMPurify 渲染) ---------- */
  .msg .bubble p { margin: 6px 0; }
  .msg .bubble > :first-child { margin-top: 0; }
  .msg .bubble > :last-child { margin-bottom: 0; }
  .msg .bubble h1, .msg .bubble h2, .msg .bubble h3, .msg .bubble h4 { margin: 10px 0 4px; line-height: 1.4; }
  .msg .bubble h1 { font-size: 17px; }
  .msg .bubble h2 { font-size: 16px; }
  .msg .bubble h3, .msg .bubble h4 { font-size: 15px; }
  .msg .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 13px; display: block; overflow-x: auto; max-width: 100%; }
  .msg .bubble th, .msg .bubble td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; }
  .msg .bubble th { background: var(--bg); font-weight: 600; white-space: nowrap; }
  .msg .bubble tr:nth-child(even) td { background: #fafafa; }
  .msg .bubble ul, .msg .bubble ol { margin: 4px 0 4px 20px; }
  .msg .bubble li { margin: 2px 0; }
  .msg .bubble li > p { margin: 0; }
  .msg .bubble blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--sub); margin: 6px 0; }
  .msg .bubble del { color: var(--sub); }
  .msg .bubble hr { border: none; border-top: 1px solid var(--line); margin: 10px 0; }
  /* ---------- 会话归档 ---------- */
  .sess-item { position: relative; }
  .sess-archive { position: absolute; top: 8px; right: 8px; border: 1px solid transparent; background: transparent; color: var(--sub); font-size: 12px; cursor: pointer; padding: 2px 7px; border-radius: 6px; opacity: 0; }
  .sess-item:hover .sess-archive, .sess-archive:focus-visible { opacity: 1; background: #fff; border-color: var(--line); }
  @media (hover: none) { .sess-archive { opacity: 1; background: #fff; border-color: var(--line); } }
  /* ---------- 移动端 ---------- */
  #menu-btn { display: none; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 10px; font-size: 15px; cursor: pointer; }
  .head-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  #backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 25; }
  #backdrop.show { display: block; }
  #to-bottom { display: none; position: absolute; right: 22px; bottom: 92px; z-index: 10; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 12px; color: var(--sub); cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  #to-bottom.show { display: block; }
  #main { position: relative; }
  @media (max-width: 820px) {
    #sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 30; width: 82vw; max-width: 320px; transform: translateX(-105%); transition: transform .2s ease; box-shadow: 0 0 24px rgba(0,0,0,.15); }
    #sidebar.open { transform: none; }
    #menu-btn { display: inline-block; flex-shrink: 0; }
    .msg { max-width: 92%; }
    #messages { padding: 14px 12px; }
    #input-row { padding: 10px 12px; }
    .empty .lang-picks { flex-wrap: wrap; justify-content: center; }
    #to-bottom { bottom: 84px; right: 14px; }
  }
</style>
</head>
<body>
<div id="app">
  <!-- ===================== 左栏 ===================== -->
  <aside id="sidebar">
    <div id="sb-head">
      <h1>📚 多语教师</h1>
      <p>日语 · 法语 · 满语 · 土耳其语</p>
    </div>
    <div id="sb-ws">专属工作区 · 与开发会话隔离</div>
    <div id="lang-tabs">
      <button class="lang-tab active" data-lang="all">全部</button>
      <button class="lang-tab" data-lang="日语">🇯🇵 日语</button>
      <button class="lang-tab" data-lang="法语">🇫🇷 法语</button>
      <button class="lang-tab" data-lang="满语">📜 满语</button>
      <button class="lang-tab" data-lang="土耳其语">🇹🇷 土耳其语</button>
    </div>
    <div id="session-list"></div>
    <div id="sb-new">
      <button id="new-sess-btn">＋ 新开一课</button>
    </div>
    <div id="conn"><span class="badge" id="conn-dot"></span><span id="conn-text">连接中…</span></div>
  </aside>

  <div id="backdrop"></div>

  <!-- ===================== 主区 ===================== -->
  <main id="main">
    <div id="chat-head">
      <div class="head-left">
        <button id="menu-btn" title="会话列表">☰</button>
        <div id="chat-title">选择或新建一个课程会话</div>
      </div>
      <div id="chat-actions"></div>
    </div>
    <div id="messages">
      <div class="empty" id="empty-state">
        <h2>👋 今天想上什么课?</h2>
        <p>AI 教师会读取你的学习档案(AGENTS.md / 教学状态.md / 词汇本),<br>按既定教学法给你上课、更新进度、录入生词。</p>
        <div class="lang-picks">
          <button onclick="startLesson('日语')">🇯🇵 上日语</button>
          <button onclick="startLesson('法语')">🇫🇷 上法语</button>
          <button onclick="startLesson('满语')">📜 上满语</button>
          <button onclick="startLesson('土耳其语')">🇹🇷 上土耳其语</button>
        </div>
      </div>
    </div>
    <div id="input-row">
      <textarea id="prompt" placeholder="跟老师说…(Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
      <button id="send" disabled>发送</button>
    </div>
    <div class="notice" id="statusline">正在读取服务状态…</div>
    <button id="to-bottom">↓ 回到底部</button>
  </main>
</div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script>
"use strict";
// ============================================================
// 多语教师 · 定制前端 —— 通过 Kimi Code 官方 REST/WS API 驱动
// 协议参考: https://www.kimi.com/code/docs/en/kimi-code-cli/reference/server-api.html
// 要点:
//  - REST 统一信封 { code, msg, data }; code===0 为成功
//  - WS 连接后必须发送 subscribe 控制帧才会推送会话事件:
//      { type:"subscribe", payload:{ session_ids:[id] } }
//  - 事件信封 { type, seq, offset?, session_id, payload }, 数据都在 payload 里:
//      assistant.delta  -> payload.delta (增量文本, offset 去重)
//      tool.call.started-> payload.name / payload.args
//      tool.result      -> payload.output / payload.isError
//      turn.ended       -> payload.reason
//  - GET messages 返回最新在前, 渲染历史时需反转
// 本页需由后端(同源)或经 CORS 白名单的 Kimi web server 提供服务。
// 若 Kimi server 与页面不同源, 在下方改 API_BASE 并确保 CORS 已放行。
// ============================================================
const API_BASE = (window.__KIMI_API_BASE__ || ""); // 同源时留空
// 语言教师专属 workspace(Kimi 会话按 workspace 隔离,教学与开发互不混)
// 可在 URL 加 ?ws=<workspace_id> 覆盖(默认锁定语言教师工作区)
const PULU_WS = "wd_pulu_language_teacher_610e23f92ac6";
const WORKSPACE_ID = new URLSearchParams(location.search).get("ws") || PULU_WS;
const LINES = { "日语":"jp", "法语":"fr", "满语":"mnc", "土耳其语":"tr" };
const LINE_NAMES = Object.keys(LINES);

let state = {
  sessions: [], activeId: null, filter: "all", busy: false,
  ws: null, subscribedId: null, reconnectTimer: null, everConnected: false, pingTimer: null,
};
let els = {};
// 当前 turn 的流式渲染状态
let stream = { buf: "", bubble: null, placeholder: null, curTool: null, watchdog: null };

// ---------- 鉴权模式 ----------
// 公网部署(teacher.47.96.147.63.sslip.io): Caddy 已做账号密码门禁(basicauth)
//   并把 Kimi bearer token 注入到 /api/* 反代 —— 页面无需任何 token,直接用。
// 直连模式(本地 127.0.0.1:58627 或 file://): 需要 #token= 或 localStorage。
const PROXIED = location.hostname.endsWith(".sslip.io") || location.hostname.endsWith(".nip.io");
function effectiveToken() {
  if (PROXIED) return ""; // 由 Caddy 注入,页面不携带
  const frag = location.hash.match(/token=([A-Za-z0-9_-]+)/);
  if (frag) { localStorage.setItem("kimi_token", frag[1]); return frag[1]; }
  return localStorage.getItem("kimi_token") || "";
}

// ---------- REST 封装 ----------
async function api(method, path, body) {
  const headers = { "Content-Type": "application/json" };
  const tok = effectiveToken();
  if (tok) headers["Authorization"] = "Bearer " + tok;
  const res = await fetch(API_BASE + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  if (res.status === 401) throw new Error("AUTH: 未授权(公网请检查账号密码;直连请检查 token)");
  if (res.status === 429) throw new Error("RATE: 请求被限流(认证失败次数过多),请 1 分钟后重试");
  const j = await res.json().catch(() => ({}));
  if (j.code !== 0 && j.code !== undefined) throw new Error(`API ${j.code}: ${j.msg || "未知错误"}`);
  return j.data;
}

// ---------- 语言线检测 ----------
// 只看语言名关键词和日文假名;不能用汉字区间(中文标题会被误判成日语)
function detectLine(text) {
  if (!text) return "";
  for (const name of LINE_NAMES) if (text.includes(name)) return name;
  if (/[ぁ-んァ-ヶ]/.test(text)) return "日语";
  return "";
}

// ---------- 会话列表 ----------
async function loadSessions() {
  try {
    // 不传 page_size: 服务端返回不分页的完整窗口(page_size 上限 100,传 200 会 40001)
    const d = await api("GET", `/api/v1/sessions?workspace_id=${encodeURIComponent(WORKSPACE_ID)}`);
    state.sessions = (d.items || []).filter(s => !s.archived);
    renderSessions();
  } catch (e) { setStatus("⚠ " + e.message); return false; }
  return true;
}
function renderSessions() {
  const el = els.list; el.innerHTML = "";
  const sorted = [...state.sessions].sort((a,b) => (b.updated_at||"").localeCompare(a.updated_at||""));
  let shown = 0;
  for (const s of sorted) {
    // 语言线: 优先用建会话时写入的 metadata.line, 老会话回退到标题/内容猜测
    const metaLine = s.metadata && LINES[s.metadata.line] ? s.metadata.line : "";
    const line = metaLine || detectLine((s.title||"") + " " + (s.last_prompt||""));
    if (state.filter !== "all" && line !== state.filter) continue;
    shown++;
    const div = document.createElement("div");
    div.className = "sess-item" + (s.id === state.activeId ? " active" : "");
    const t = (s.title || "(无标题)").replace(/^["']|["']$/g, "");
    div.innerHTML = `
      ${line ? `<span class="s-line ${LINES[line]||''}">${line}</span>` : ""}
      <div class="s-title">${escapeHtml(t)}</div>
      <div class="s-meta">
        <span>${fmtTime(s.updated_at)}</span>
        <span>${s.busy ? '<span class="badge busy"></span>进行中' : '<span class="badge"></span>就绪'}</span>
      </div>`;
    div.onclick = () => openSession(s.id);
    const arc = document.createElement("button");
    arc.className = "sess-archive"; arc.title = "归档此会话"; arc.textContent = "归档";
    arc.onclick = (ev) => { ev.stopPropagation(); archiveSession(s.id, t); };
    div.appendChild(arc);
    el.appendChild(div);
  }
  if (!shown) el.innerHTML = `<div style="padding:14px;font-size:13px;color:var(--sub)">没有${state.filter==='all'?'':'该语言线的'}会话,点下方“新开一课”。</div>`;
}
async function archiveSession(id, title) {
  if (!confirm(`归档会话「${title}」?\n归档后从列表隐藏,可用 Kimi 主界面恢复。`)) return;
  try {
    await api("POST", `/api/v1/sessions/${encodeURIComponent(id)}:archive`, {});
    if (state.activeId === id) closeActiveView();
    await loadSessions();
  } catch (e) { setStatus("⚠ 归档失败: " + e.message); }
}
function closeActiveView() {
  state.activeId = null;
  resetStream();
  els.msgs.innerHTML = "";
  els.msgs.appendChild(els.empty);
  els.empty.style.display = "";
  els.title.textContent = "选择或新建一个课程会话";
}

// ---------- 打开会话 / 历史 ----------
async function openSession(id) {
  state.activeId = id;
  renderSessions();
  closeSidebar(); // 移动端点选后收起抽屉
  els.empty.style.display = "none";
  els.title.textContent = "加载中…";
  resetStream();
  try {
    const d = await api("GET", `/api/v1/sessions/${encodeURIComponent(id)}/messages?page_size=50`);
    const msgs = (d.items || []).slice().reverse(); // API 最新在前,反转为时间正序
    els.msgs.innerHTML = "";
    for (const m of msgs) renderHistoryMessage(m);
    const meta = state.sessions.find(s => s.id === id);
    els.title.textContent = meta ? (meta.title || "(无标题)").slice(0, 80) : "会话";
    state.busy = !!(meta && (meta.busy || meta.main_turn_active));
    if (state.busy) stream.placeholder = addPlaceholder(); // 进行中: 显示等待占位,事件流到达后接管
    setSendState();
    scrollBottom(true);
  } catch (e) {
    els.title.textContent = "会话";
    setStatus("⚠ " + e.message);
  }
  subscribeSession(id); // 保证 WS 已连接且订阅当前会话
}
function renderHistoryMessage(m) {
  // 跳过系统注入消息(日期提醒等), 不是真实对话内容
  if (m.metadata && m.metadata.origin && m.metadata.origin.kind === "injection") return;
  const role = m.role || (m.type === "user" ? "user" : "assistant");
  if (role === "user") { const t = textOf(m); if (t.trim()) addBubble("user", t); return; }
  if (role !== "assistant") return;
  const txt = textOf(m);
  if (txt && txt.trim()) addBubble("assistant", txt);
  for (const c of (Array.isArray(m.content) ? m.content : [])) {
    if (c && c.type === "tool_use" && (c.name || c.input)) {
      addToolEvent(c.name || "tool", briefToolIO(c.input));
    }
  }
}
function textOf(m) {
  const cs = m.content || [];
  if (typeof cs === "string") return cs;
  const parts = [];
  for (const c of cs) {
    if (c && c.type === "text" && c.text) parts.push(c.text);
  }
  return parts.join("\n");
}
function briefToolIO(input) {
  if (!input) return "";
  return (typeof input === "string" ? input : JSON.stringify(input)).slice(0, 400);
}

// ---------- 新建会话 ----------
async function createSession(title, line) {
  try {
    const body = { workspace_id: WORKSPACE_ID };
    if (title) body.title = title;
    const d = await api("POST", "/api/v1/sessions", body);
    const id = d.id || d.session_id;
    // 教学会话没有审批 UI, 必须 auto 权限模式, 否则老师读文件/更新词汇本时会卡在无人审批
    // 创建接口不投影自定义 metadata, 语言线经同一 profile 调用写入
    await api("POST", `/api/v1/sessions/${encodeURIComponent(id)}/profile`, {
      agent_config: { permission_mode: "auto" },
      ...(line ? { metadata: { line } } : {}),
    }).catch(() => {});
    await loadSessions();
    await openSession(id);
    return id;
  } catch (e) { setStatus("⚠ 新建失败: " + e.message); return null; }
}

// ---------- 快速开课 ----------
async function startLesson(lang) {
  if (state.busy) return;
  const hintMap = {
    "日语": "我们继续上日语课。先读教学状态.md 定位进度,再按 AGENTS.md 的上课流程来。",
    "法语": "我们继续上法语课。先读教学状态.md 定位进度,再按 AGENTS.md 的上课流程来。",
    "满语": "我们继续上满语课。先读教学状态.md 定位进度,再按 AGENTS.md 的上课流程来。",
    "土耳其语": "我们继续上土耳其语课。先读教学状态.md 定位进度,再按 AGENTS.md 的上课流程来。"
  };
  const now = new Date();
  const stamp = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  const id = await createSession(`${lang}课 ${stamp}`, lang);
  if (id) sendPrompt(hintMap[lang] || "我们开始上课吧");
}

// ---------- 发送 ----------
async function sendPrompt(text) {
  if (!text.trim() || state.busy) return;
  if (!state.activeId) { const id = await createSession(); if (!id) return; }
  addBubble("user", text);
  els.prompt.value = ""; autoGrow(); setSendState();
  state.busy = true; setSendState();
  stream.placeholder = addPlaceholder();
  subscribeSession(state.activeId); // 发送前确保已订阅,否则收不到流式事件
  // 看门狗: 15 秒内没等到 turn.started 就认为实时链路断了,解锁界面
  clearTimeout(stream.watchdog);
  stream.watchdog = setTimeout(() => {
    if (state.busy && stream.placeholder) {
      removePlaceholder(stream.placeholder); stream.placeholder = null;
      addBubble("assistant", "⚠ 未收到服务的实时响应。请检查与 Kimi 服务的连接(左下角),再重新发送。");
      state.busy = false; setSendState();
    }
  }, 15000);
  try {
    await api("POST", `/api/v1/sessions/${encodeURIComponent(state.activeId)}/prompts`, {
      content: [{ type: "text", text }]
    });
    // 后续流式事件由 WS 推送
  } catch (e) {
    clearTimeout(stream.watchdog);
    removePlaceholder(stream.placeholder); stream.placeholder = null;
    addBubble("assistant", "⚠ 发送失败: " + e.message);
    state.busy = false; setSendState();
  }
}

// ---------- WebSocket 流式 ----------
function ensureWS() {
  if (state.ws && (state.ws.readyState === WebSocket.OPEN || state.ws.readyState === WebSocket.CONNECTING)) return;
  const tok = effectiveToken();
  const proto = tok ? ["kimi-code.bearer." + tok] : undefined; // 直连用 subprotocol;公网由 Caddy 注入头
  const url = (API_BASE || location.origin).replace(/^http/, "ws") + "/api/v1/ws";
  let ws;
  try { ws = proto ? new WebSocket(url, proto) : new WebSocket(url); }
  catch (e) { scheduleReconnect(); return; }
  state.ws = ws;
  state.subscribedId = null;
  const wasReconnect = state.everConnected; // 首次连接不算重连
  ws.onopen = () => {
    setConn(true);
    state.everConnected = true;
    // 中间链路(Caddy/frp)对空闲 WS 有 heartbeat 超时, 客户端每 25s 发 ping 保活
    clearInterval(state.pingTimer);
    state.pingTimer = setInterval(() => {
      if (state.ws && state.ws.readyState === WebSocket.OPEN) {
        state.ws.send(JSON.stringify({ type: "ping", payload: {} }));
      }
    }, 25000);
    if (state.activeId) subscribeSession(state.activeId);
    // 重连后失联期间的 delta(volatile 不重放)和 turn.ended 可能已丢:
    // 若本地还认为在忙, 重新加载当前会话以对齐服务端真实状态
    if (wasReconnect && state.activeId && state.busy) openSession(state.activeId);
  };
  ws.onclose = (ev) => {
    if (state.ws !== ws) return; // 旧连接的残留事件,忽略
    console.warn("WS closed", ev.code, ev.reason || "");
    clearInterval(state.pingTimer);
    state.ws = null; state.subscribedId = null;
    setConn(false);
    scheduleReconnect();
  };
  ws.onerror = () => { /* 交给 onclose 处理 */ };
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    handleEvent(m);
  };
}
function scheduleReconnect() {
  if (state.reconnectTimer) return;
  state.reconnectTimer = setTimeout(() => { state.reconnectTimer = null; ensureWS(); }, 3000);
}
function subscribeSession(id) {
  if (!id) return;
  ensureWS();
  if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return; // onopen 时会补订阅
  if (state.subscribedId === id) return;
  if (state.subscribedId) {
    state.ws.send(JSON.stringify({ type: "unsubscribe", payload: { session_ids: [state.subscribedId] } }));
  }
  state.ws.send(JSON.stringify({ type: "subscribe", payload: { session_ids: [id] } }));
  state.subscribedId = id;
}

function handleEvent(m) {
  const type = m.type || "";
  const p = m.payload || {};
  // 全局事件: 会话标题/状态有变化就刷新列表
  if (type === "session.meta.updated" || type.indexOf("event.session.") === 0) { loadSessions(); return; }
  if (type === "server_hello" || type === "ack" || type === "ping" || type === "pong") return;
  // 只处理当前会话的事件
  if (m.session_id && state.activeId && m.session_id !== state.activeId) return;
  switch (type) {
    case "turn.started":
      clearTimeout(stream.watchdog);
      closeTool();
      stream.buf = ""; stream.bubble = null; stream.errShown = false;
      state.busy = true; setSendState();
      break;
    case "assistant.delta": {
      const txt = p.delta || "";
      if (!txt) break;
      // offset 是本轮累计字符偏移,小于本地已收长度说明是重复帧
      if (typeof m.offset === "number" && m.offset < stream.buf.length) break;
      streamAppend(txt);
      break;
    }
    case "tool.call.started":
      closeTool();
      stream.bubble = null; // 后续文本另起新气泡,排在工具事件之后
      stream.curTool = addToolEventLive(p.name || "tool", p.args);
      break;
    case "tool.result": {
      if (!stream.curTool) break;
      const out = typeof p.output === "string" ? p.output
        : (p.output && typeof p.output.output === "string" ? p.output.output : JSON.stringify(p.output ?? ""));
      stream.curTool.buf += out + "\n";
      const io = stream.curTool.el.querySelector(".t-io");
      io.textContent = (stream.curTool.head + (out ? "\n" + stream.curTool.buf : "")).slice(0, 3000);
      closeTool();
      break;
    }
    case "turn.ended":
      closeTool();
      if ((p.reason === "failed" || p.reason === "cancelled") && !stream.errShown) {
        removePlaceholder(stream.placeholder); stream.placeholder = null;
        const errMsg = (p.error && (p.error.message || p.error.code)) || p.interruptReason || "";
        addBubble("assistant", p.reason === "cancelled" ? "⏹ 已中断" : ("⚠ 本轮出错" + (errMsg ? ": " + errMsg : "")));
        stream.errShown = true; // 随后的 error 事件不再重复报错(两种到达顺序都覆盖)
      }
      finishTurn();
      break;
    case "error":
      if (!stream.errShown) {
        removePlaceholder(stream.placeholder); stream.placeholder = null;
        addBubble("assistant", "⚠ " + (p.message || p.code || "未知错误"));
        stream.errShown = true;
      }
      finishTurn();
      break;
    // thinking.delta / tool.call.delta / tool.progress 等中间事件不渲染
  }
}
function closeTool() {
  if (stream.curTool) { stream.curTool.el.classList.add("t-done"); stream.curTool = null; }
}
function finishTurn() {
  clearTimeout(stream.watchdog);
  removePlaceholder(stream.placeholder); stream.placeholder = null;
  removeCursor();
  stream.buf = ""; stream.bubble = null;
  state.busy = false; setSendState();
  loadSessions(); // 刷新标题/状态
}
function resetStream() {
  clearTimeout(stream.watchdog);
  stream.buf = ""; stream.bubble = null; stream.placeholder = null; stream.curTool = null; stream.errShown = false;
  state.busy = false; setSendState();
}

// ---------- DOM 渲染辅助 ----------
function addBubble(role, text) {
  const box = document.createElement("div");
  box.className = "msg " + role;
  const b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = renderMarkdown(text);
  box.appendChild(b);
  els.msgs.appendChild(box);
  scrollBottom();
  return box;
}
function addPlaceholder() {
  const box = document.createElement("div");
  box.className = "msg assistant";
  const b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = `<span class="typing">老师思考中<span class="stream-cursor"></span></span>`;
  box.appendChild(b);
  els.msgs.appendChild(box);
  scrollBottom();
  return box;
}
function removePlaceholder(box) { if (box && box.parentNode) box.parentNode.removeChild(box); }
function addToolEvent(name, io) {
  const d = document.createElement("div");
  d.className = "tool-event t-done";
  d.innerHTML = `<span class="t-name">🔧 ${escapeHtml(name)}</span><div class="t-io">${escapeHtml(io || "")}</div>`;
  els.msgs.appendChild(d);
  return d;
}
function addToolEventLive(name, input) {
  const d = document.createElement("div");
  d.className = "tool-event";
  const head = briefToolIO(input);
  d.innerHTML = `<span class="t-name">🔧 ${escapeHtml(name)}</span><div class="t-io">${escapeHtml(head)}</div>`;
  els.msgs.appendChild(d);
  scrollBottom();
  return { el: d, buf: "", head };
}
function streamAppend(txt) {
  if (stream.placeholder) { removePlaceholder(stream.placeholder); stream.placeholder = null; }
  if (!stream.bubble) {
    stream.buf = "";
    const box = document.createElement("div");
    box.className = "msg assistant";
    const b = document.createElement("div");
    b.className = "bubble";
    box.appendChild(b);
    els.msgs.appendChild(box);
    stream.bubble = b;
  }
  stream.buf += txt;
  stream.bubble.innerHTML = renderMarkdown(stream.buf);
  const c = document.createElement("span"); c.className = "stream-cursor";
  stream.bubble.appendChild(c);
  scrollBottom();
}
function removeCursor() { document.querySelectorAll(".stream-cursor").forEach(x => x.remove()); }
function escapeHtml(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function renderMarkdown(s) {
  // marked(GFM: 表格/删除线/任务列表) + DOMPurify(防 XSS); 本地 vendor 加载失败时退化为纯文本
  if (window.marked && window.DOMPurify) {
    return DOMPurify.sanitize(marked.parse(s, { gfm: true, breaks: true, async: false }));
  }
  return escapeHtml(s);
}
function fmtTime(iso) { if (!iso) return ""; const d = new Date(iso); const now = new Date(); const same = d.toDateString() === now.toDateString(); return same ? d.toTimeString().slice(0,5) : `${d.getMonth()+1}/${d.getDate()}`; }
// 仅在用户本来就近底部时才自动跟随; 上翻阅读时不打断, 改为显示"回到底部"胶囊
function nearBottom() { const m = els.msgs; return m.scrollHeight - m.scrollTop - m.clientHeight < 120; }
function scrollBottom(force) {
  if (force || nearBottom()) {
    els.msgs.scrollTop = els.msgs.scrollHeight;
    els.toBottom.classList.remove("show");
  } else {
    els.toBottom.classList.add("show");
  }
}
function openSidebar() { document.getElementById("sidebar").classList.add("open"); els.backdrop.classList.add("show"); }
function closeSidebar() { document.getElementById("sidebar").classList.remove("open"); els.backdrop.classList.remove("show"); }
function setStatus(t) { els.status.textContent = t; }
function setConn(ok) { els.connDot.className = "badge" + (ok ? "" : " busy"); els.connText.textContent = ok ? "已连接 Kimi 教师" : "连接断开,重连中…"; }
function setSendState() { els.send.disabled = state.busy || !els.prompt.value.trim(); }
function autoGrow() { els.prompt.style.height = "auto"; els.prompt.style.height = Math.min(els.prompt.scrollHeight, 160) + "px"; }
function keydown(ev) {
  // isComposing: 中文输入法选词中的 Enter 不触发发送
  if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) {
    ev.preventDefault();
    if (!state.busy && els.prompt.value.trim()) sendPrompt(els.prompt.value);
  }
}

// ---------- 启动 ----------
window.addEventListener("DOMContentLoaded", init);
async function init() {
  els = {
    list: document.getElementById("session-list"),
    empty: document.getElementById("empty-state"),
    msgs: document.getElementById("messages"),
    title: document.getElementById("chat-title"),
    actions: document.getElementById("chat-actions"),
    prompt: document.getElementById("prompt"),
    send: document.getElementById("send"),
    status: document.getElementById("statusline"),
    connDot: document.getElementById("conn-dot"),
    connText: document.getElementById("conn-text"),
    backdrop: document.getElementById("backdrop"),
    toBottom: document.getElementById("to-bottom"),
    menuBtn: document.getElementById("menu-btn"),
  };
  if (!PROXIED) {
    const tok = effectiveToken();
    if (!tok) {
      setStatus("⚠ 缺少访问 token。直连模式请用带 #token= 的完整链接打开本页。");
      setConn(false);
      return;
    }
  }
  // 语言 tab 绑定
  document.querySelectorAll(".lang-tab").forEach(t => t.onclick = () => {
    document.querySelectorAll(".lang-tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    state.filter = t.dataset.lang;
    renderSessions();
  });
  els.prompt.addEventListener("input", () => { autoGrow(); setSendState(); });
  els.prompt.addEventListener("keydown", keydown);
  els.send.onclick = () => sendPrompt(els.prompt.value);
  // "新开一课"沿用当前筛选 Tab 的语言线(全部 → 不标注)
  document.getElementById("new-sess-btn").onclick = () => createSession(null, state.filter !== "all" ? state.filter : null);
  els.menuBtn.onclick = () => openSidebar();
  els.backdrop.onclick = () => closeSidebar();
  els.toBottom.onclick = () => scrollBottom(true);
  els.msgs.addEventListener("scroll", () => { if (nearBottom()) els.toBottom.classList.remove("show"); });
  // 空状态快捷开课按钮在 HTML 里 onclick=startLesson
  setStatus("正在连接 Kimi 教师服务…");
  setConn(false);
  ensureWS(); // 即使还没选会话也连上,用于接收全局事件
  const ok = await loadSessions();
  if (ok) setStatus("就绪。选择左侧会话继续上课,或点“新开一课”。");
}
</script>
